##############################################
# 开发环境基础设施：PostgreSQL(TimescaleDB) + Redis + MinIO + EMQX
# 用法：pnpm infra:up  /  pnpm infra:down
##############################################
name: digital-twin-dev

services:
  postgres:
    # TimescaleDB 镜像内置 PostgreSQL 15，满足时序数据(iot_device_telemetry)需求
    image: timescale/timescaledb:2.14.2-pg15
    container_name: dt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-digital_twin}
      TZ: Asia/Shanghai
      # 统一 Unicode 字符集
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      # 首次启动自动执行版本化 SQL（建表 + 种子数据）
      - ../apps/backend/widget-server/src/database/sql:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=timescaledb
      # 慢查询日志阈值 1s
      - -c
      - log_min_duration_statement=1000
      - -c
      - max_connections=200
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digital_twin}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: dt-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO 已从 Docker Hub 撤下镜像（拉取报 pull access denied），统一改用官方 quay.io 仓库
    image: quay.io/minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: dt-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

  # IoT 协议接入网关（MQTT），数据底座使用。
  # 说明：原用 emqx/emqx:5.7.1，但该镜像在部分网络环境下拉取失败（registry 层缺失），
  # 改用体积更小的 eclipse-mosquitto；二者对 MQTT 3.1.1/5 的基础订阅发布行为一致，
  # 演示与开发无差异。若生产需要集群/规则引擎再切回 EMQX。
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: dt-mosquitto
    restart: unless-stopped
    ports:
      - '1883:1883' # MQTT
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    profiles:
      - iot
