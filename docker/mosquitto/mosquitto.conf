# 开发环境 MQTT Broker 配置（eclipse-mosquitto:2）
#
# Mosquitto 2.x 默认拒绝匿名连接且只监听本机，这里显式放开，
# 让后端 MqttDriver 与 docker/iot-simulator.mjs 能直接连 1883。
# 生产环境请改为账号密码认证（配合后端 MQTT_INGEST_USERNAME / PASSWORD）。

listener 1883
protocol mqtt

# 开发便利：允许匿名连接
allow_anonymous true

# 开发态不做持久化：容器内 /mosquitto/data 常为只读或属主不匹配（尤其 Windows 宿主目录挂载），
# 开启持久化会导致 Broker 启动即退出。
persistence false

log_dest stdout
log_type all
