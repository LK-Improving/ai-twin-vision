##############################################
# 生产环境 Nginx 反向代理
# - 静态资源：Gzip/Brotli + 强缓存
# - API：负载均衡至 NestJS 集群
# - WebSocket：长连接保持 24h（Yjs 协同 / IoT 推送）
# - 限流：单 IP 频率限制，防御 CC
##############################################

upstream backend_service {
    least_conn;
    server widget-server-1:3000 max_fails=3 fail_timeout=30s;
    server widget-server-2:3000 max_fails=3 fail_timeout=30s backup;
    keepalive 64;
}

# 限流区：单 IP 每秒 20 请求，突发 50
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 三维模型 500MB 上限
    client_max_body_size 500m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/wasm
               model/gltf+json model/gltf-binary image/svg+xml application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带内容哈希的构建产物：长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- Cesium 静态资源 ----------
    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # ---------- 3D 模型 / 瓦片：CORS + 长缓存，供 CDN 回源 ----------
    location ~* \.(gltf|glb|b3dm|i3dm|pnts|cmpt|terrain|ktx2|basis|drc)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range,Content-Type";
        add_header Access-Control-Expose-Headers "Content-Length,Content-Range";
        access_log off;
    }

    # ---------- API 代理 ----------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket：Yjs 协同编辑 / IoT 实时推送 ----------
    location /ws {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s; # 长连接保持 24 小时
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ---------- 健康检查 / 监控 ----------
    location = /healthz {
        proxy_pass http://backend_service/api/v1/health;
        access_log off;
    }
}
