name: CI

# 触发策略（迭代 4.2）：
# - PR 与 main 推送：跑完整质量门禁（类型 / lint / 样式 / 拼写 / 单测 / 构建 / 体积棘轮）
# - main 推送额外做「服务冒烟」：真起 Postgres+Redis，跑 schema:init 后打健康检查与登录接口
# - Docker 镜像只 build 不 push：推送需要仓库 secrets，缺省时自动降级为构建校验
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 版本取自根 package.json 的 packageManager 字段，避免此处重复钉一遍
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # --frozen-lockfile 顺带守住「package.json 与 lockfile 漂移」这类问题
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 必须在 typecheck 之前：rendering-engine / widgets 的 tsconfig 把 @dt/shared-types
      # 指向 dist/index.d.ts（否则外部源码会被拉进本项目 rootDir 而报 TS6059），
      # 所以干净 checkout 不先构建共享包就会 typecheck 失败。
      - name: 构建共享包（为类型检查产出 dist）
        run: pnpm build:pkg

      - name: 类型检查（含 e2e 代码）
        run: pnpm typecheck

      - name: Lint（error 即失败）
        run: pnpm lint

      - name: 样式检查（Stylelint，只管 CSS 语义问题，格式归 Prettier）
        run: pnpm lint:style

      - name: 拼写检查（cspell，覆盖代码与配置，中文文档正文不纳入）
        run: pnpm lint:spell

      - name: 单元测试
        run: pnpm -r test

      - name: 全量构建
        run: pnpm -r build

      - name: 前端产物体积棘轮
        run: node scripts/ci-size-report.mjs --budget scripts/size-budget.json

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: builder-dist
          path: apps/frontend/builder/dist
          retention-days: 7
          if-no-files-found: error

  api-smoke:
    name: 后端与数据库冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # 只有 main 才跑，避免 PR 阶段重复消耗
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        # 与 docker-compose.dev.yml 保持同一版本线（TimescaleDB 内置 PG15）；
        # 无该扩展时 01_schema.sql 会把遥测表降级为普通表，冒烟仍可跑通
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: digital_twin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      API_PORT: '3001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # .env.dev 已从版本库移除（含第三方密钥），所以 CI 必须能从模板重建环境；
      # 这一步同时是对那条安全决策的持续校验：新克隆拿不到 env 文件也能起服务。
      - name: 由模板生成本地环境
        run: cp .env.example .env.dev

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建共享包与后端
        run: pnpm --filter @dt/shared-types build && pnpm --filter @dt/widget-server build

      - name: 初始化库结构与种子数据
        run: pnpm --filter @dt/widget-server schema:init

      # 服务与接口校验必须在同一个 step 内完成：step 结束后 runner 会清理进程组，
      # 靠「上一个 step 后台启动 + 下一个 step 访问」在不同 runner 上会随机挂。
      # CI 无 MQTT broker，临时把摄取开关关掉（代码本身支持 false 跳过连接）。
      - name: 启动服务并校验健康与登录链路
        env:
          MQTT_INGEST_ENABLED: 'false'
        run: |
          set -euo pipefail
          nohup node dist/main.js >/tmp/api.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; echo "----- api log -----"; tail -n 60 /tmp/api.log' EXIT

          ok=''
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3001/api/v1/health >/tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "健康检查 60s 内未通过" >&2; exit 1; fi
          cat /tmp/health.json

          body=$(curl -fs -X POST http://127.0.0.1:3001/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"Admin@123"}')
          echo "$body" | head -c 300
          echo "$body" | grep -q '"accessToken"' || { echo "登录未返回 accessToken" >&2; exit 1; }
          echo "登录链路 OK（JWT + RBAC 种子账号）"
        working-directory: apps/backend/widget-server

  e2e:
    name: 端到端冒烟（Playwright）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: digital_twin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      API_PORT: '3001'
      E2E_BASE_URL: http://127.0.0.1:5199
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # 浏览器二进制缓存键：同时钉住 playwright 版本与 OS，版本升级自动失效
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'

      # 必须在任何 ts-node / vite 之前：shared-types 的 main/types 指向 dist，
      # 而后端 entities 从 @dt/shared-types 导入枚举、BizCode/ComponentType 还是运行时值。
      # 首跑就是在这里报 `error TS2307: Cannot find module '@dt/shared-types'`。
      # 后端也必须在这里构建：下一个 step 要 `node dist/main.js`，而各作业互相独立，
      # 不能假定 api-smoke 已经构建过（那次就因缺 dist/main.js 直接起不来）。
      - name: 构建共享包与后端
        run: pnpm build:pkg && pnpm --filter @dt/widget-server build

      - name: 由模板生成环境并准备数据库
        run: |
          set -euo pipefail
          cp .env.example .env.dev
          pnpm --filter @dt/widget-server schema:init
          pnpm db:seed

      # 同 api-smoke：后端、前端、用例必须在同一个 step 里，否则 runner 会在 step 之间杀掉进程组。
      # 前端用 5199 + strictPort：端口被占就直接失败，不静默跳端口（否则 baseURL 与实测不在同一处）。
      - name: 启动前后端并跑端到端用例
        env:
          MQTT_INGEST_ENABLED: 'false'
        run: |
          set -euo pipefail
          nohup node apps/backend/widget-server/dist/main.js >/tmp/api.log 2>&1 &
          API=$!
          nohup pnpm --filter @dt/builder exec vite --port 5199 --strictPort --host 127.0.0.1 >/tmp/web.log 2>&1 &
          WEB=$!
          trap 'kill $API $WEB 2>/dev/null || true; echo "----- api log -----"; tail -n 40 /tmp/api.log; echo "----- web log -----"; tail -n 40 /tmp/web.log' EXIT

          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3001/api/v1/health >/dev/null && curl -fs http://127.0.0.1:5199/ >/dev/null; then
              echo "前后端就绪"; break
            fi
            if [ "$i" -eq 30 ]; then echo "服务 60s 内未就绪" >&2; exit 1; fi
            sleep 2
          done

          pnpm test:e2e

      # 分两个 artifact 上传：之前把两棵树放进同一个包，导致 `gh run download` 在解压时
      # 撞上同名条目直接中断（error extracting "e2e-report/data/<hash>.zip": The file exists），
      # 等于故障发生了但证据拿不到。现在即使下载失败，上一步的 [diag] 日志也足够定位。
      - name: 上传 HTML 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-html-report
          path: e2e-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传测试现场（trace / 截图 / 视频）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/.artifacts/
          retention-days: 7
          if-no-files-found: ignore

  migration:
    name: 数据库迁移与漂移门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    # 迁移门禁对 PR 也必须生效，不能只等合入 main
    services:
      postgres:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: digital_twin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: 由模板生成环境
        run: cp .env.example .env.dev

      - name: 安装依赖与共享包
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @dt/shared-types build

      # 验收点一：空库必须能只靠 migration 建出完整结构（不再依赖“全量 SQL 重放”）
      - name: 空库执行基线迁移
        run: pnpm db:migrate

      - name: 断言版本记录与基线结构
        run: |
          set -euo pipefail
          db() { psql "postgresql://postgres:root@localhost:5432/digital_twin" -Atc "$1"; }
          versions=$(db 'select count(*) from sys_migrations')
          tables=$(db "select count(*) from information_schema.tables where table_schema='public'")
          pt=$(db "select count(*) from information_schema.columns where column_name='publish_token'")
          echo "sys_migrations=$versions tables=$tables publish_token=$pt"
          [ "$versions" -ge 1 ] || { echo '迁移未写入版本记录' >&2; exit 1; }
          [ "$tables" -ge 20 ] || { echo '基线未建出预期表数' >&2; exit 1; }
          [ "$pt" = '1' ] || { echo '增量迁移的 publish_token 未生效' >&2; exit 1; }

      - name: 种子数据可重复执行
        run: |
          set -euo pipefail
          pnpm db:seed && pnpm db:seed
          n=$(psql "postgresql://postgres:root@localhost:5432/digital_twin" -Atc 'select count(*) from sys_user')
          echo "sys_user=$n"
          [ "$n" -gt 0 ] || { echo '种子数据未写入' >&2; exit 1; }

      # 验收点二：改了 entity 忘记新增 migration 时，这里会拦下
      # （基线噪声已分类排除，实测净变更为 0，详见 scripts/check-migration-drift.mjs 头部说明）
      - name: 实体与库结构漂移检查
        run: pnpm db:check-drift

  docker:
    name: 镜像构建（${{ matrix.image }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 不要在 `if:` 表达式里引用 secrets —— GitHub 的工作流校验会直接报
      # “Unrecognized named-value: 'secrets'”，且这是**文件级**错误：整个工作流一个作业都不会跑。
      # 这里先把“凭据是否齐备”算成一个步骤 output，后续 if 只引用它（只输出布尔值，不回显密钥）。
      - name: 检测镜像仓库凭据
        id: registry
        env:
          REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
          REGISTRY_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${{ vars.DOCKER_REGISTRY }}" ] && [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # 配了 registry 变量与凭据才登录并推送；否则仅构建校验 Dockerfile 可用性
      - name: 登录镜像仓库
        if: steps.registry.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 未配置 registry secrets 时只构建不推送：既验证 Dockerfile 可用，
      # 又不会在缺凭据时红掉；真正推送需要配 DOCKER_REGISTRY(var) + USERNAME/PASSWORD(secret)。
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: ${{ steps.registry.outputs.available == 'true' }}
          load: ${{ steps.registry.outputs.available != 'true' }}
          tags: |
            ${{ vars.DOCKER_REGISTRY || 'local' }}/digital-twin-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
