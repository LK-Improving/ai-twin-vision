name: CI

# 触发策略（迭代 4.2）：
# - PR 与 main 推送：跑完整质量门禁（类型 / lint / 样式 / 拼写 / 单测 / 构建 / 体积棘轮）
# - main 推送额外做「服务冒烟」：真起 Postgres+Redis，跑 schema:init 后打健康检查与登录接口
# - Docker 镜像只 build 不 push：推送需要仓库 secrets，缺省时自动降级为构建校验
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 版本取自根 package.json 的 packageManager 字段，避免此处重复钉一遍
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # --frozen-lockfile 顺带守住「package.json 与 lockfile 漂移」这类问题
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（8 个项目）
        run: pnpm -r typecheck

      - name: Lint（error 即失败）
        run: pnpm lint

      - name: 样式检查（Stylelint，只管 CSS 语义问题，格式归 Prettier）
        run: pnpm lint:style

      - name: 拼写检查（cspell，覆盖代码与配置，中文文档正文不纳入）
        run: pnpm lint:spell

      - name: 单元测试
        run: pnpm -r test

      - name: 全量构建
        run: pnpm -r build

      - name: 前端产物体积棘轮
        run: node scripts/ci-size-report.mjs --budget scripts/size-budget.json

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: builder-dist
          path: apps/frontend/builder/dist
          retention-days: 7
          if-no-files-found: error

  api-smoke:
    name: 后端与数据库冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    # 只有 main 才跑，避免 PR 阶段重复消耗
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        # 与 docker-compose.dev.yml 保持同一版本线（TimescaleDB 内置 PG15）；
        # 无该扩展时 01_schema.sql 会把遥测表降级为普通表，冒烟仍可跑通
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: digital_twin
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_twin"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      API_PORT: '3001'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # .env.dev 已从版本库移除（含第三方密钥），所以 CI 必须能从模板重建环境；
      # 这一步同时是对那条安全决策的持续校验：新克隆拿不到 env 文件也能起服务。
      - name: 由模板生成本地环境
        run: cp .env.example .env.dev

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建共享包与后端
        run: pnpm --filter @dt/shared-types build && pnpm --filter @dt/widget-server build

      - name: 初始化库结构与种子数据
        run: pnpm --filter @dt/widget-server schema:init

      # 服务与接口校验必须在同一个 step 内完成：step 结束后 runner 会清理进程组，
      # 靠「上一个 step 后台启动 + 下一个 step 访问」在不同 runner 上会随机挂。
      # CI 无 MQTT broker，临时把摄取开关关掉（代码本身支持 false 跳过连接）。
      - name: 启动服务并校验健康与登录链路
        env:
          MQTT_INGEST_ENABLED: 'false'
        run: |
          set -euo pipefail
          nohup node dist/main.js >/tmp/api.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; echo "----- api log -----"; tail -n 60 /tmp/api.log' EXIT

          ok=''
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:3001/api/v1/health >/tmp/health.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "健康检查 60s 内未通过" >&2; exit 1; fi
          cat /tmp/health.json

          body=$(curl -fs -X POST http://127.0.0.1:3001/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"Admin@123"}')
          echo "$body" | head -c 300
          echo "$body" | grep -q '"accessToken"' || { echo "登录未返回 accessToken" >&2; exit 1; }
          echo "登录链路 OK（JWT + RBAC 种子账号）"
        working-directory: apps/backend/widget-server

  docker:
    name: 镜像构建（${{ matrix.image }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 配了 registry 变量与凭据才登录并推送；否则仅构建校验 Dockerfile 可用性
      - name: 登录镜像仓库
        if: ${{ vars.DOCKER_REGISTRY != '' && secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 未配置 registry secrets 时只构建不推送：既验证 Dockerfile 可用，
      # 又不会在缺凭据时红掉；真正推送需要配 DOCKER_REGISTRY(var) + USERNAME/PASSWORD(secret)。
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: ${{ vars.DOCKER_REGISTRY != '' }}
          load: ${{ vars.DOCKER_REGISTRY == '' }}
          tags: |
            ${{ vars.DOCKER_REGISTRY || 'local' }}/digital-twin-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
